[project]
name = "opensearch-dashboards-charms-single-kernel"
dynamic = ["version"]
description = "Shared and reusable code for OpenSearch Dashboards charms"
readme = "README.md"
license = "Apache-2.0"
authors = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10,<4.0"


[project.urls]
homepage = "https://github.com/canonical/opensearch-dashboards-single-kernel-library"
repository = "https://github.com/canonical/opensearch-dashboards-single-kernel-library"
"Bug Tracker" = "https://github.com/canonical/opensearch-dashboards-single-kernel-library/issues"
"Matrix" = "https://matrix.to/#/#charmhub-data-platform:ubuntu.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["single_kernel_opensearch_dashboards*"]
exclude = ["terraform*"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.codespell]
skip = "*.lock"

[tool.poetry]
requires-poetry = ">=2.0.0"
package-mode = true
packages = [{ include = "single_kernel_opensearch_dashboards" }]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry.dependencies]
charmlibs-pathops = "^1.3.0"
python = "^3.10"
tenacity = "^9.1.4"
pyyaml = "^6.0.3"
requests = "^2.32.4"

# TODO: clean any of the notes below and their deps.
[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = "^2.23.0"
# data_platform_libs/v0/upgrade.py
poetry-core = "^2.1.3"
# tls_certificates_interface/v3/tls_certificates.py
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
# data_platform_libs/v0/upgrade.py requires pydantic ^1.10
# grafana_agent/v0/cos_agent.py requires pydantic
pydantic = ">2, <3"
# grafana_agent/v0/cos_agent.py
cosl = "^1.0.0"
data-platform-helpers = "^0.1.7"

[tool.poetry.group.fmt]
optional = true


[tool.poetry.group.fmt.dependencies]
black = "^25.1.0"
isort = "^6.1.0"


[tool.poetry.group.lint]
optional = true

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
dirty = true
strict = true
fix-shallow-repository = true

[build-system]
requires = ["poetry-core>=2.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.1.0"
flake8 = "^7.3.0"
flake8-docstrings = "^1.7.0"
flake8-copyright = "^0.2.4"
flake8-builtins = "^2.5.0"
pyproject-flake8 = "^7.0.0"
pep8-naming = "^0.15.1"
codespell = "^2.4.2"
pyright = "^1.1.410"
typing-extensions = "^4.15.0"
requests = "^2.32.4"
ops = "^2.23.0"

[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
charmlibs-pathops = "^1.3.0"
pytest = "^8.4.1"
coverage = { extras = ["toml"], version = "^7.14.1" }
pytest-mock = "^3.15.1"
pyyaml = "^6.0.3"
responses = "^0.26.1"

[tool.poetry.group.integration.dependencies]
charmlibs-pathops = "^1.3.0"
pytest = "^8.4.1"
juju = "^3.6.1.3"
tenacity = "^9.1.4"
coverage = { extras = ["toml"], version = "^7.14.1" }
pytest-asyncio = "^0.26.0"
pytest-operator = "^0.43.2"
pytest-microceph = { git = "https://github.com/canonical/data-platform-workflows", tag = "v32.2.3", subdirectory = "python/pytest_plugins/microceph" }
allure-pytest = "^2.16.0"
allure-pytest-default-results = "^0.1.4"
pytest-playwright = "^0.8.0"
oauth_tools = { git = "https://github.com/canonical/iam-bundle", rev = "c766f23bf76a3f3b87cfaf22e8354e86dac55d99" }
pyjwt = "^2.10.1"

[tool.pyright]
include = ["src"]
extraPaths = ["./lib"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = false
reportImportCycles = false
reportMissingModuleSource = true
reportMissingImports = false
stubPath = ""
