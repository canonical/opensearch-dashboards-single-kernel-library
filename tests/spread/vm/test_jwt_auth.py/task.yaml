summary: test_jwt_auth.py
environment:
  TEST_MODULE: test_jwt_auth.py
  SCENARIO/1-tls:
    TEST_TLS: "true"
  SCENARIO/2-no-tls:
    TEST_TLS: "false"

execute: |
  export TEST_TLS
  
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results