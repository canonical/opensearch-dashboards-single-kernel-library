summary: test_scaling.py
environment:
  TEST_MODULE: ha/test_scaling.py
  TEST_TRAEFIK: true
  SUBSTRATE: "k8s"

systems:
  - ubuntu-24.04
  - ubuntu-24.04-arm
execute: |
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results