summary: test_charm.py
environment:
  TEST_MODULE: test_charm.py

  SCENARIO/v1_all_true: "TEST_TRAEFIK_TRUST=true TEST_TLS=true TEST_TRAEFIK=true"
  SCENARIO/v2_no_trust_tls_traefik: "TEST_TRAEFIK_TRUST=false TEST_TLS=true TEST_TRAEFIK=true"
  SCENARIO/v3_no_trust_tls_no_traefik: "TEST_TRAEFIK_TRUST=false TEST_TLS=true TEST_TRAEFIK=false"
  SCENARIO/v4_no_trust_no_tls_traefik: "TEST_TRAEFIK_TRUST=false TEST_TLS=false TEST_TRAEFIK=true"
  SCENARIO/v5_all_false: "TEST_TRAEFIK_TRUST=false TEST_TLS=false TEST_TRAEFIK=false"

execute: |
  export $SCENARIO
  
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --alluredir="$SPREAD_TASK/allure-results" --k8s-charm
artifacts:
  - allure-results