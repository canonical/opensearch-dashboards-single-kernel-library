request:
  description: Perform an HTTP/HTTPS request from inside the k8s cluster.
  params:
    url:
      type: string
      description: The URL to request.
    method:
      type: string
      default: GET
    username:
      type: string
    password:
      type: string
    ca_cert:
      type: string
      description: The CA certificate contents to verify the HTTPS connection.