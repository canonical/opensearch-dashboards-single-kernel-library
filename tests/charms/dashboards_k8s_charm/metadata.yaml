name: opensearch-dashboards-k8s
display-name: Opensearch Dashboards K8s
description: |
  OpenSearch Dashboard is a community-driven, Apache 2.0-licensed open source 
  user interface that lets you visualize your OpenSearch data and run and scale
  your OpenSearch clusters.

summary: The Charmed Opensearch Dashboards operator
docs: https://discourse.charmhub.io/t/charmed-opensearch-dashboards-home/14117
source: https://github.com/canonical/opensearch-dashboards-operator
issues: https://github.com/canonical/opensearch-dashboards-operator/issues
charm-user: non-root

maintainers:
  - Canonical Data Platform Team <data-platform@lists.launchpad.net>

containers:
  opensearch-dashboards:
    resource: opensearch-dashboards-image

resources:
  opensearch-dashboards-image:
    type: oci-image
    description: OCI image for opensearch-dashboards
    # TODO: Make sure to use opensearch-dashboards-charmed once released
    upstream-source: ghcr.io/canonical/opensearch-dashboards:2.19.6-24.04_edge@sha256:2ec45428334edab4690ab535cb74904d0596dcc459ef67ef21f4a9429e0ec6c8

peers:
  dashboard_peers:
    interface: dashboard_peers
  restart:
    interface: rolling_op
  upgrade:
    interface: upgrade
  status-peers:
    interface: status-peers

requires:
  opensearch-client:
    interface: opensearch_client
    limit: 1
  certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  oauth:
    interface: oauth
    limit: 1
    optional: true
  jwt-configuration:
    interface: jwt
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
  ingress:
    interface: ingress
    limit: 1

provides:
  metrics-endpoint:
    interface: prometheus_scrape
  grafana-dashboard:
    interface: grafana_dashboard