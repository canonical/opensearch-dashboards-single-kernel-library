name: Update OpenSearch Dashboards docs submodule

on:
    push:
        branches:
        - 2/edge
        paths:
        - 'docs/**'

    workflow_dispatch:

jobs:
    update-docs-submodule:
        name: Open PR to update OpenSearch Dashboards docs submodule
        runs-on: ubuntu-latest
        permissions: {}
        env:
            BASE_BRANCH: 2/edge
            PR_BRANCH: auto/update-dashboards-docs-submodule-${{ github.sha }}
            # Path to the submodule inside the opensearch-operator repository
            SUBMODULE_PATH: docs/dashboards
            TARGET_REPO: canonical/opensearch-operator
        steps:

        - name: Checkout target repository
          uses: actions/checkout@v6
          with:
            repository: ${{ env.TARGET_REPO }}
            ref: ${{ env.BASE_BRANCH }}
            token: ${{ secrets.PAT }}
            submodules: true
            path: target-repo
            persist-credentials: false

        - name: Get reviewers
          id: get-reviewers
          working-directory: target-repo
          run: |
            REVIEWERS=$(grep "${SUBMODULE_PATH}" .github/CODEOWNERS \
                        | awk '{for(i=2;i<=NF;i++) print substr($i,2)}' \
                        | paste -sd "," -)

            echo "REVIEWERS=${REVIEWERS}" >> "$GITHUB_OUTPUT"

        - name: Configure git signing
          working-directory: target-repo
          env:
            SIGNING_KEY: ${{ secrets.CI_COMMITS_SSH_SIGNING_KEY }}
          run: |
            mkdir -p ~/.ssh
            echo "${SIGNING_KEY}" > ~/.ssh/ssh-key
            chmod 600 ~/.ssh/ssh-key

            git config --global user.name "canonical-data-platform-bot"
            git config --global user.email "canonical-data-platform-bot@canonical.com"

            git config --global gpg.format ssh
            git config --global user.signingkey ~/.ssh/ssh-key
            git config --global commit.gpgsign true

        - name: Update submodule to latest commit
          working-directory: target-repo
          run: |
            cd "${SUBMODULE_PATH}"
            git fetch origin
            git checkout "${GITHUB_SHA}"
            cd ..
            git add "${SUBMODULE_PATH}"

        - name: Commit changes
          working-directory: target-repo
          run: |
            if git ls-remote --exit-code --heads origin "${PR_BRANCH}" >/dev/null 2>&1; then
                echo "ERROR: Branch '${PR_BRANCH}' already exists on remote. Refusing to overwrite it."
                exit 1
            fi

            git checkout -b "${PR_BRANCH}"
            git commit -m "chore: Update OpenSearch Dashboards docs submodule to ${GITHUB_SHA}"

        - name: Push branch
          working-directory: target-repo
          env:
            GITHUB_TOKEN: ${{ secrets.PAT }}
          run: |
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git" "${PR_BRANCH}"

        - name: Open Pull Request
          working-directory: target-repo
          env:
            GITHUB_TOKEN: ${{ secrets.PAT }}
            REVIEWERS: ${{ steps.get-reviewers.outputs.REVIEWERS }}
          run: |
            BODY="Automated update of the OpenSearch Dashboards docs submodule to commit [\`${GITHUB_SHA}\`](https://github.com/canonical/opensearch-dashboards-operator/commit/${GITHUB_SHA})."

            PR_URL=$(gh pr create \
                --title "chore: Update OpenSearch Dashboards docs submodule" \
                --body "${BODY}" \
                --base "${BASE_BRANCH}" \
                --head "${PR_BRANCH}" \
                --reviewer "${REVIEWERS}"
            )
            echo "- ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
